<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizard de Acompanhamento de Processo (v2) — Antecipação · JusCash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Protótipo clicável — Wizard de Acompanhamento (v2, antecipação)
   Origem (lista + envio) → acompanhamento com ações funcionando.
   Estilo HeroUI · Fonte Figtree · Cores JusCash · Dados simulados.
   ============================================================ */
:root{
  --primary-50:#E7F0FE; --primary-100:#C3DBFD; --primary-500:#2F6FEB;
  --primary-600:#1957D6; --primary-700:#134BB8; --primary-800:#0F3D95;
  --secondary-500:#136CE2; --secondary-600:#105ABC;
  --n-50:#FAFAFA; --n-100:#F5F5F5; --n-200:#E5E5E5; --n-300:#D4D4D4;
  --n-400:#A3A3A3; --n-500:#6D6D6E; --n-600:#525252; --n-700:#404040;
  --n-800:#262626; --n-900:#171717;
  --green-50:#C9FFD6; --green-500:#1E7E34; --green-900:#065F1B;
  --red-50:#FEF2EC; --red-500:#D2190B; --red-900:#9D231C;
  --yellow-50:#FFFBE0; --yellow-500:#867400; --yellow-900:#675413;
  --blue-50:#ECF5FE; --blue-500:#207AC3; --blue-900:#1D4F79;
  --orange-50:#FFE9D2; --orange-500:#B15600;
  --text-dark:#262626; --text-soft:#6D6D6E; --text-disabled:#A3A3A3;
  --link:#207AC3; --link-hover:#1D4F79;
  --bg-white:#FAFAFA; --bg-grey:#F5F5F5; --border:#D4D4D4;
  --r-sm:8px; --r-md:12px; --r-lg:14px; --r-xl:18px; --r-full:9999px;
  --shadow-xs:0 1px 2px rgba(23,23,23,.06);
  --shadow-sm:0 2px 8px rgba(23,23,23,.08);
  --shadow-md:0 8px 24px rgba(23,23,23,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Figtree',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text-dark);background:var(--n-200);-webkit-font-smoothing:antialiased;line-height:1.45}

/* ---------- Barra de revisão compacta (1 linha) ---------- */
.review-bar{position:sticky;top:0;z-index:50;background:var(--n-900);color:var(--n-100);padding:7px 14px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #000;flex-wrap:wrap}
.rb-title{font-weight:700;font-size:11.5px;white-space:nowrap;flex-shrink:0;padding-top:4px}
.rb-title span{font-weight:400;color:var(--n-400)}
.rb-strip{display:flex;align-items:center;gap:6px;row-gap:6px;flex-wrap:wrap;flex:1;min-width:0;max-height:58px;overflow-y:auto;padding-right:4px}
.rb-strip::-webkit-scrollbar{width:5px}
.rb-strip::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:9px}
.rb-glabel{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#7d7d7d;font-weight:700;white-space:nowrap;padding:0 2px 0 8px;flex-shrink:0}
.rb-glabel:first-child{padding-left:0}
.rb-pill{background:#2b2b2b;color:var(--n-100);border:1px solid #3a3a3a;border-radius:var(--r-full);padding:4px 10px;font-size:11px;cursor:pointer;transition:.12s;white-space:nowrap;font-weight:500;flex-shrink:0}
.rb-pill:hover{background:#3a3a3a}
.rb-pill.active{background:var(--primary-600);border-color:var(--primary-500);color:#fff;font-weight:700}
.rb-pill.flow{border-color:var(--secondary-500)}
.rb-pill.cond{border-style:dashed;border-color:var(--yellow-500)}
.rb-pill.final{border-color:var(--red-900)}
.rb-nav{display:flex;gap:6px;align-items:center;flex-shrink:0;padding-top:1px}
.rb-nav button{background:#2b2b2b;color:#fff;border:1px solid #3a3a3a;border-radius:var(--r-sm);padding:5px 10px;font-size:13px;line-height:1;cursor:pointer;font-weight:700;font-family:inherit}
.rb-nav button:hover{background:#3a3a3a}

/* ---------- App shell ---------- */
.app{display:flex;min-height:calc(100vh - 44px);max-width:1440px;margin:0 auto;background:var(--bg-white)}
.sidebar{width:264px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px}
.which-top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 20px}
.which-logo{font-size:17px;color:var(--n-900);letter-spacing:-.2px}
.which-logo b{font-weight:800}
.which-logo span{font-weight:400;color:var(--n-500)}
.which-toggle{width:28px;height:28px;border:1px solid var(--n-200);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--n-400);font-size:13px;cursor:pointer}
.fin-label{padding:14px 10px 12px;border-top:1px solid var(--n-200);margin-top:2px;display:flex;flex-direction:column;font-size:11px;color:var(--n-400);text-transform:uppercase;letter-spacing:.4px}
.fin-label b{font-size:15px;color:var(--n-900);text-transform:none;letter-spacing:0;font-weight:700}
.fin-label .fin-by{margin-top:1px;font-size:11.5px;color:var(--n-400);text-transform:none;letter-spacing:0}
.fin-label .fin-by b{font-size:11.5px;color:#5B4FE9;font-weight:700}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary-600),var(--primary-800));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.brand .bt b{font-size:15px;color:var(--text-dark);font-weight:800}
.brand .bt small{display:block;font-size:11px;color:var(--text-soft)}
.side-cta{margin:0 4px 16px;background:var(--primary-600);color:#fff;border:none;border-radius:var(--r-sm);padding:11px 12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center;font-family:inherit}
.side-cta:hover{background:var(--primary-800)}
.side-menu{display:flex;flex-direction:column;gap:2px}
.side-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--text-soft);font-size:13.5px;font-weight:600;cursor:pointer}
.side-item .ic{width:18px;height:18px;opacity:.75;display:inline-flex;align-items:center;justify-content:center}
.side-item .ic svg{width:16px;height:16px}
.side-item:hover{background:var(--n-100)}
.side-item.active{background:#EEECFC;color:#4B3FD1}
.side-item.active .ic{opacity:1}
.side-spacer{flex:1}
.side-foot{border-top:1px solid var(--n-200);padding-top:14px;margin-top:14px}

/* ---------- Conteúdo ---------- */
.content{flex:1;min-width:0;padding:26px 34px 70px;background:var(--bg-white);overflow:auto}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-soft);margin-bottom:16px}
.breadcrumb b{color:var(--text-dark)}
.breadcrumb .sep{color:var(--n-400)}
.breadcrumb .lnk{color:var(--link);cursor:pointer}
.breadcrumb .lnk:hover{text-decoration:underline}

.page-h{margin-bottom:20px}
.page-h h1{font-size:24px;font-weight:800}
.page-h p{font-size:13.5px;color:var(--text-soft);max-width:640px;margin-top:4px}
.page-h-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}

/* proc-head (wizard) */
.proc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;background:#fff;border:1px solid var(--n-200);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-xs);margin-bottom:22px}
.proc-head h1{font-size:19px;font-weight:800;margin-bottom:6px}
.proc-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--text-soft)}
.proc-meta b{color:var(--text-dark);font-weight:600}
.help-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--secondary-600);border:1.5px solid var(--secondary-600);border-radius:var(--r-full);padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.help-btn:hover{background:var(--blue-50)}

/* stepper */
.journey{background:#fff;border:1px solid var(--n-200);border-radius:var(--r-lg);padding:22px 20px 18px;box-shadow:var(--shadow-xs);margin-bottom:12px}
.journey-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.journey-top h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-soft)}
.journey-top .jt-right{font-size:12px;color:var(--text-soft)}
.stepper{display:flex;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.step .dot{width:30px;height:30px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;z-index:2;border:2px solid var(--n-300);background:#fff;color:var(--n-400)}
.step .lbl{font-size:11px;margin-top:8px;text-align:center;color:var(--n-400);font-weight:600;padding:0 2px;line-height:1.2}
.step .bar{position:absolute;top:14px;left:50%;width:100%;height:3px;background:var(--n-200);z-index:1}
.step:last-child .bar{display:none}
.step.done .dot{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.step.done .bar{background:var(--primary-600)}
.step.done .lbl{color:var(--text-soft)}
.step.current .dot{background:#fff;border-color:var(--primary-600);color:var(--primary-700);box-shadow:0 0 0 4px var(--primary-50)}
.step.current .lbl{color:var(--primary-800);font-weight:800}
.step.fail .dot{background:var(--red-500);border-color:var(--red-500);color:#fff}
.step.fail .lbl{color:var(--red-900);font-weight:800}

/* status card */
.status-card{background:#fff;border:1px solid var(--n-200);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:16px}
.sc-accent{height:5px;width:100%}
.sc-body{padding:24px 26px}
.sc-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-full);padding:5px 13px;font-size:12.5px;font-weight:700;line-height:1}
.badge .bdot{width:8px;height:8px;border-radius:var(--r-full);background:currentColor}
.badge.info{background:var(--blue-50);color:var(--blue-900)}
.badge.wait{background:var(--yellow-50);color:var(--yellow-900)}
.badge.action{background:var(--orange-50);color:var(--orange-500)}
.badge.success{background:var(--green-50);color:var(--green-900)}
.badge.error{background:var(--red-50);color:var(--red-900)}
.badge.neutral{background:var(--n-100);color:var(--n-600)}
.cond-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--yellow-900);background:var(--yellow-50);border:1px dashed var(--yellow-500);padding:4px 10px;border-radius:var(--r-full)}
.sugg-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#7A4E00;background:#FFF6E0;border:1px dashed #C99A2E;padding:4px 10px;border-radius:var(--r-full)}
.detail-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--text-soft);background:var(--n-100);padding:4px 10px;border-radius:var(--r-full)}
.sugg-note{font-size:12px;color:#7A4E00;background:#FFF6E0;border:1px dashed #C99A2E;border-radius:var(--r-md);padding:8px 12px;margin:10px 0 14px}
.sc-title{font-size:22px;font-weight:800;margin:10px 0 4px}
.sc-prazo{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-soft);margin-bottom:14px}
.sc-prazo .clock{width:15px;height:15px}
.sc-desc{font-size:15px;color:var(--n-700);max-width:640px;margin-bottom:4px}

/* ação */
.action{margin-top:22px;border-top:1px solid var(--n-200);padding-top:20px}
.action h3{font-size:14px;font-weight:800;margin-bottom:4px}
.action p.sub{font-size:13px;color:var(--text-soft);margin-bottom:14px;max-width:600px}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:var(--r-sm);padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid transparent;font-family:inherit;transition:.12s}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary-600);color:#fff}
.btn-primary:not(:disabled):hover{background:var(--primary-800)}
.btn-outline{background:#fff;color:var(--text-dark);border-color:var(--border)}
.btn-outline:hover{background:var(--n-100)}
.btn-ghost{background:transparent;color:var(--text-soft)}
.btn-ghost:hover{background:var(--n-100)}
.btn-danger-o{background:#fff;color:var(--red-900);border-color:var(--red-500)}
.btn-danger-o:hover{background:var(--red-50)}
.btn-sm{padding:8px 14px;font-size:13px}
.page-btn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-full);font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-dark)}
.page-btn:hover{background:var(--n-100)}
.page-btn.active{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.dropzone{border:2px dashed var(--n-300);border-radius:var(--r-md);background:var(--n-50);padding:26px;text-align:center;color:var(--text-soft);max-width:560px;display:block;cursor:pointer;transition:.12s}
.dropzone:hover{border-color:var(--primary-600);background:#fff}
.dropzone .up-ic{width:30px;height:30px;margin:0 auto 8px;color:var(--n-400)}
.dropzone b{color:var(--link);font-weight:700}
.dropzone .hint{font-size:11.5px;color:var(--n-400);margin-top:6px}
.filechip{display:inline-flex;align-items:center;gap:10px;background:var(--green-50);border:1px solid #a9edbb;color:var(--green-900);border-radius:var(--r-sm);padding:9px 13px;font-size:13px;font-weight:600;max-width:560px;margin-top:4px}
.filechip svg{width:16px;height:16px;flex-shrink:0}
.filechip span:not(.x){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip .x{margin-left:auto;cursor:pointer;color:var(--green-900);opacity:.6;font-weight:800;flex-shrink:0}
.filechip .x:hover{opacity:1}
.bigcheck svg{width:30px;height:30px}

.field{max-width:460px;margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.field .req{color:var(--red-500)}
.field input,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;font-size:14px;font-family:inherit;color:var(--text-dark);background:#fff}
.field input[type=checkbox]{width:16px;height:16px;flex:none;padding:0;border:1.5px solid var(--border);border-radius:4px;accent-color:var(--primary-600)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--primary-600);box-shadow:0 0 0 3px var(--primary-50)}
.field.err input{border-color:var(--red-500);box-shadow:0 0 0 3px var(--red-50)}
.field .msg{font-size:12px;color:var(--red-900);margin-top:6px;display:none}
.field.err .msg{display:block}
.or-sep{display:flex;align-items:center;gap:12px;color:var(--n-400);font-size:12px;font-weight:700;margin:16px 0;max-width:560px}
.or-sep::before,.or-sep::after{content:"";height:1px;background:var(--n-200);flex:1}

/* radios / toggles */
.radiorow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rchip{border:1.5px solid var(--n-200);border-radius:var(--r-sm);padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;background:#fff}
.rchip:hover{border-color:var(--primary-600)}
.rchip.sel{border-color:var(--primary-600);background:var(--primary-50);color:var(--primary-800)}
.rchip svg{width:14px;height:14px;flex-shrink:0;vertical-align:-2px;margin-right:4px}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px}
.toggle .tk{width:40px;height:22px;border-radius:var(--r-full);background:var(--n-300);position:relative;transition:.15s;flex-shrink:0}
.toggle .tk::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:var(--r-full);background:#fff;transition:.15s}
.toggle.on .tk{background:var(--primary-600)}
.toggle.on .tk::after{left:20px}

/* proposta */
.proposal{border:1px solid var(--n-200);border-radius:var(--r-md);overflow:hidden;background:#fff}
.proposal .p-top{background:var(--primary-50);padding:18px 20px;border-bottom:1px solid var(--primary-100)}
.proposal .p-top small{font-size:12px;color:var(--primary-800);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.proposal .p-top .val{font-size:30px;font-weight:800;color:var(--primary-800);margin-top:2px}
.proposal .p-rows{padding:6px 20px}
.p-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--n-100);font-size:13.5px}
.p-row:last-child{border-bottom:none}
.p-row span{color:var(--text-soft)} .p-row b{font-weight:700}
.p-note{font-size:12px;color:var(--text-soft);padding:0 20px 16px;display:flex;gap:7px;align-items:flex-start}

.checklist{list-style:none;max-width:560px;margin-bottom:16px}
.checklist li{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--n-200);border-radius:var(--r-sm);margin-bottom:8px;font-size:13.5px;align-items:center;background:#fff}
.checklist li .num{width:22px;height:22px;border-radius:var(--r-full);background:var(--n-100);color:var(--n-600);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.doc-item{display:flex;justify-content:space-between;align-items:center}
.doc-item .st{font-size:11.5px;color:var(--yellow-900);font-weight:700}

.alert{display:flex;gap:12px;border-radius:var(--r-md);padding:14px 16px;max-width:600px;margin-bottom:16px;font-size:13.5px}
.a-ic{flex-shrink:0;width:20px;height:20px}
.p-note .a-ic{width:16px;height:16px}
.alert svg{width:20px;height:20px;flex-shrink:0}
.alert.error{background:var(--red-50);border:1px solid #f3c9c2;color:var(--red-900)}
.alert.info{background:var(--blue-50);border:1px solid #cfe4f7;color:var(--blue-900)}
.alert.success{background:var(--green-50);border:1px solid #a9edbb;color:var(--green-900)}
.alert b{font-weight:800}

.slots{display:flex;flex-direction:column;gap:9px;max-width:520px;margin-bottom:16px}
.slot{display:flex;align-items:center;gap:12px;border:1.5px solid var(--n-200);border-radius:var(--r-sm);padding:13px 15px;cursor:pointer;font-size:14px;background:#fff}
.slot:hover{border-color:var(--primary-600);background:var(--n-50)}
.slot.sel{border-color:var(--primary-600);box-shadow:0 0 0 3px var(--primary-50)}
.slot .radio{width:18px;height:18px;border-radius:var(--r-full);border:2px solid var(--n-300);flex-shrink:0;position:relative}
.slot.sel .radio{border-color:var(--primary-600)}
.slot.sel .radio::after{content:"";position:absolute;inset:3px;border-radius:var(--r-full);background:var(--primary-600)}
.slot b{font-weight:700} .slot span{color:var(--text-soft);font-size:12.5px}

.result{display:flex;gap:16px;align-items:center;background:var(--green-50);border:1px solid #a9edbb;border-radius:var(--r-md);padding:18px 20px;max-width:520px;margin-bottom:16px}
.result .r-ic{width:40px;height:40px;border-radius:var(--r-full);background:var(--green-500);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.result .r-ic svg{width:22px;height:22px}
.result .val{font-size:26px;font-weight:800;color:var(--green-900)}
.result small{color:var(--green-900);font-weight:600;font-size:12px}

/* painel de simulação (protótipo) */
.sim{margin-top:20px;border:1px dashed var(--n-300);border-radius:var(--r-md);background:var(--n-50);padding:14px 16px;max-width:600px}
.sim .sim-h{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-soft);font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.sim .sim-h svg{width:15px;height:15px;flex-shrink:0;color:var(--n-500)}
.sim .sim-h .tag{background:var(--n-800);color:#fff;border-radius:var(--r-full);padding:2px 8px;font-size:9px;letter-spacing:.4px}

/* ajuda persistente */
.help-card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--n-200);border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--shadow-xs);margin-top:16px}

.help-card .hc-tx{flex:1}
.help-card .hc-tx b{font-size:14px;font-weight:800;display:block}
.help-card .hc-tx small{font-size:12.5px;color:var(--text-soft)}

/* lista de antecipações */
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--n-200);margin-bottom:20px}
.tab2{padding:11px 16px;font-size:13.5px;font-weight:700;color:var(--text-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab2:hover{color:var(--text-dark)}
.tab2.sel{color:var(--primary-800);border-bottom-color:var(--primary-600)}
.pcards{display:flex;flex-direction:column;gap:12px}
.pcards .pcard{width:100%;box-sizing:border-box;align-self:stretch}
.metrics-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.metric-card{flex:1;min-width:220px;background:#fff;border:1px solid var(--n-200);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-xs)}
.metric-card .m-lbl{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;color:var(--text-dark)}
.metric-card .m-lbl svg{width:16px;height:16px;color:var(--text-soft)}
.metric-card .m-val{font-size:32px;font-weight:800;margin:14px 0 6px;color:var(--text-dark)}
.metric-card .m-sub{font-size:12.5px;color:var(--text-soft)}
.pcard{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--n-200);border-radius:var(--r-lg);padding:16px 20px;box-shadow:var(--shadow-xs);cursor:pointer;transition:.12s;min-height:92px}
.pcard:hover{box-shadow:var(--shadow-md);border-color:var(--n-300)}
.pcard .pc-main{flex:1;min-width:0}
.pcard .pc-num{font-size:15px;font-weight:800}
.pcard .pc-meta{font-size:12.5px;color:var(--text-soft);margin-top:2px}
.pcard .pc-status{font-size:12px;color:var(--text-soft);margin-top:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;row-gap:6px}
.pcard .pc-status .badge{white-space:normal;text-align:left}
.pcard .chev{color:var(--n-400);font-size:20px}

/* modal */
.modal-ov{position:fixed;inset:0;background:rgba(23,23,23,.35);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:var(--r-xl);max-width:460px;width:100%;box-shadow:var(--shadow-md);overflow:hidden}
.modal .m-body{padding:26px}
.modal h3{font-size:19px;font-weight:800;margin-bottom:8px}
.modal p{font-size:14px;color:var(--n-700);margin-bottom:20px}
.modal .m-foot{display:flex;gap:12px;justify-content:flex-end}

/* toast */
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1px solid var(--n-200);border-left:4px solid var(--primary-600);border-radius:var(--r-md);padding:13px 16px;box-shadow:var(--shadow-md);max-width:360px;font-size:13.5px;animation:tin .2s ease}
.toast .t-ic{color:var(--primary-600);flex-shrink:0;width:20px;height:20px}
.toast b{font-weight:800;display:block}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* chat (assistente Cashito) */
.chat-ov{position:fixed;inset:0;background:rgba(23,23,23,.35);z-index:85;display:none}
.chat-ov.open{display:block}
.chat{position:fixed;top:0;right:0;height:100%;width:392px;max-width:94vw;background:#fff;box-shadow:var(--shadow-md);z-index:86;display:flex;flex-direction:column;transform:translateX(100%);transition:.22s ease}
.chat.open{transform:none}
.chat-head{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--primary-600);color:#fff}
.chat-head .av{width:38px;height:38px;border-radius:var(--r-full);background:#fff;color:var(--primary-700);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}

.chat-head small{font-size:11.5px;opacity:.9}
.chat-head .cx{margin-left:auto;cursor:pointer;font-size:18px;opacity:.9;background:none;border:none;color:#fff;font-weight:700}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px;background:var(--n-50)}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.45}

.msg.user{background:var(--primary-600);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}

.sugg.human{border-color:var(--n-300);color:var(--text-soft)}

.chat-foot{padding:12px;display:flex;gap:8px;align-items:center;background:#fff;border-top:1px solid var(--n-200)}
.chat-foot input{flex:1;border:1.5px solid var(--border);border-radius:var(--r-full);padding:10px 15px;font-size:13.5px;font-family:inherit}

function responderDuvida(){ duvidaResposta='Sua proposta segue válida, sem alteração no valor ou nas condições. Você pode aceitar ou recusar quando quiser.'; goto('proposta'); }
let elegivel={desagio:false, ir:false};
function setElegivel(flags){ elegivel=Object.assign({desagio:false, ir:false}, flags); }
const COMPLEMENTAR_LABEL={desagio:'deságio flexível', ir:'devolução de IR', modelo50:'segunda parcela do modelo 50%'};
const COMPLEMENTAR_MOTIVO_NEGADO={
  desagio:'deságio flexível: após análise, vimos que o prazo do deságio flexível já venceu sem que o crédito tivesse sido recebido dentro dele, então não há valor adicional a pagar',
  ir:'devolução de IR: após análise, vimos que o valor calculado inicialmente (R$ 5.000,00) foi igual ao valor efetivamente descontado (R$ 5.000,00), então não há diferença a devolver',

function motivoComplementarNegado(tipos){
  const motivos=tipos.map(t=>COMPLEMENTAR_MOTIVO_NEGADO[t]);
  if(motivos.length===1) return motivos[0].charAt(0).toUpperCase()+motivos[0].slice(1)+'.';
  return motivos.map(m=>m.charAt(0).toUpperCase()+m.slice(1)).join('. ')+'.';
}
function setComplementar(tipos){ complementar={tipos}; }
function labelComplementarLista(tipos){
  const labs=tipos.map(t=>COMPLEMENTAR_LABEL[t]);
  if(labs.length===1) return labs[0];
  return labs.slice(0,-1).join(', ')+' e '+labs[labs.length-1];

function toast(title,msg){
  const w=document.getElementById('toast-wrap');

  t.innerHTML=`<span class="t-ic">${ic.check}</span><div><b>${title}</b>${msg?`<span>${msg}</span>`:''}</div>`;
  w.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},3200);
}
function onFile(key){
  const inp=document.getElementById('f_'+key);
  if(inp.files&&inp.files.length){
    uploads[key]=[...inp.files].map(f=>f.name);
    render();
  }
}
function clearFile(key){ delete uploads[key]; render(); }

}

/* envio do processo */
function setCred(c){ envio.cred=c; render(); }
function toggleSegredo(){ envio.segredo=!envio.segredo; render(); }
function toggleCashback(){ envio.cashback=!envio.cashback; if(!envio.cashback) envio.cashbackValor=''; render(); }
function setCashbackValor(v){
  let n=parseFloat((v||'').replace(',','.'));
  if(isNaN(n)) n=0;
  envio.cashbackValor=v.trim()?v.trim():'';
  envio.cashbackErro=(n>CASHBACK_DISPONIVEL);
  render();
}
function cashbackTudo(){ envio.cashbackValor=String(CASHBACK_DISPONIVEL).replace('.',','); envio.cashbackErro=false; render(); }

function toggleUnico(){ envio.unico=envio.unico===false?true:false; render(); }
function submitEnvio(){
  const f=document.getElementById('num_proc');
  const digits=(f.value||'').replace(/\D/g,'');
  const wrap=document.getElementById('field_num');
  const msg=document.getElementById('msg_num');
  if(digits.length<20){
    msg.textContent='Informe um número de processo válido (padrão CNJ, 20 dígitos).';
    wrap.classList.add('err'); f.focus(); return;
  }
  const anoProc=parseInt(digits.substring(9,13),10);
  const anoAtual=new Date().getFullYear();
  if(anoProc>=anoAtual){
    msg.textContent=`Não aceitamos processos do ano vigente (${anoAtual}) ou de anos futuros. Verifique o número informado.`;
    wrap.classList.add('err'); f.focus(); return;
  }
  if(!envio.cred){ toast('Selecione o crédito','Escolha qual crédito deseja antecipar.'); return; }
  if(envio.cashback&&envio.cashbackErro){ toast('Valor de cashback inválido','Ajuste o valor de resgate antes de continuar.'); return; }
  wrap.classList.remove('err');
  goto('enviado');
}

/* navegação linear (prev/próximo) e fallback para estados fora da linha */
const ORDER=['lista','envio','enviado','recebido','analise','proposta','documentos','contrato','assinatura','protocolo','deposito','concluido'];
const OFFNAV={acesso:{p:'analise',n:'analise'},'duvida-proposta':{p:'proposta',n:'proposta'},'contestacao-analise':{p:'nao-aprovado',n:'nao-aprovado'},'contestacao-contrato-analise':{p:'assinatura',n:'assinatura'},sessao:{p:'protocolo',n:'deposito'},'aguarda-homologacao':{p:'protocolo',n:'deposito'},'homologacao-50':{p:'deposito',n:'concluido'},'complementar-analise':{p:'concluido',n:'complementar-aditivo'},'complementar-aditivo':{p:'complementar-analise',n:'deposito'},'complementar-negado':{p:'complementar-analise',n:'concluido'},'nao-aprovado':{p:'analise',n:'envio'},encerrada:{p:'proposta',n:'envio'}};

let current='lista';
let history=[];

function goto(id){ if(id!==current) history.push(current); current=id; render(); }
function voltarApresentacao(){ if(history.length){ current=history.pop(); render(); } }
function nextNav(){
  const i=ORDER.indexOf(current);
  if(i>=0){ current=ORDER[Math.min(i+1,ORDER.length-1)]; }
  else if(OFFNAV[current]){ current=OFFNAV[current].n; }
  render();
}
function prevNav(){
  const i=ORDER.indexOf(current);
  if(i>=0){ current=ORDER[Math.max(i-1,0)]; }
  else if(OFFNAV[current]){ current=OFFNAV[current].p; }
  render();
}

/* ================= Render ================= */

function renderStepper(s){
  let h='<div class="stepper">';
  STEPS.forEach((label,i)=>{
    let cls='step';
    if(s.terminal){ if(i<s.failAt)cls+=' done'; else if(i===s.failAt)cls+=' fail'; }
    else { if(i<s.step)cls+=' done'; else if(i===s.step)cls+=' current'; }
    const mark=cls.includes('done')?'✓':cls.includes('fail')?'!':(i+1);
    h+=`<div class="${cls}"><div class="bar"></div><div class="dot">${mark}</div><div class="lbl">${label}</div></div>`;
  });
  return h+'</div>';
}

function renderWizard(s){
  const jt = s.terminal ? 'Jornada interrompida' : `Etapa ${s.step+1} de ${STEPS.length}`;
  return `
  <div class="breadcrumb"><span class="lnk" onclick="goto('lista')">Antecipações</span> <span class="sep">/</span> <b>Processo nº 1002411-16.2023.8.26.0100</b></div>

    <button class="btn btn-outline" onclick="openChat()">Tirar dúvidas</button>
  </div>`;
}

function render(){
  const s=byId(current);
  const content=document.getElementById('content');
  if(s.group==='flow'){
    if(s.id==='lista') content.innerHTML=screenLista();
    else if(s.id==='envio') content.innerHTML=screenEnvio();
    else content.innerHTML=screenEnviado();
  } else {
    content.innerHTML=renderWizard(s);
  }
  if(current!==prevId){ window.scrollTo({top:0,behavior:'smooth'}); prevId=current; }
}

    {q:'Como escolho o horário?', a:'Você escolhe um dos horários disponíveis na tela. Depois de confirmar, o link da chamada aparece aqui e é enviado a você.'},
  ],
  deposito:[
    {q:'Quando recebo o pagamento?', a:'O pagamento costuma ser realizado em até 24h após a liberação. Você verá a confirmação aqui.'},
  ],
  'nao-aprovado':[
    {q:'Por que o processo não foi aprovado?', a:'A aprovação depende da análise de viabilidade do processo. Posso te encaminhar para um atendente para entender melhor o seu caso.'},
    {q:'Posso enviar outro processo?', a:'Pode, sim. É só enviar um novo processo para uma nova análise gratuita.'},
  ],
  encerrada:[
    {q:'Posso reabrir a negociação?', a:'A negociação foi encerrada, mas você pode reenviar este processo ou enviar um novo para uma nova análise.'},
  ],
};
let chatMsgs=[];
function faqFor(){ const s=byId(current); return (s&&FAQ[s.id])?FAQ[s.id]:FAQ._default; }
function openChat(){
  const s=byId(current);
  const ctx=(s&&!['lista','envio','enviado'].includes(s.id))?` Vejo que este processo está em "${s.title}".`:'';
  chatMsgs=[{who:'bot',t:`Olá! Sou o Cashito, assistente da JusCash.${ctx} Como posso ajudar?`}];
  renderChat();
  document.getElementById('chat-ov').classList.add('open');
  document.getElementById('chat').classList.add('open');
  setTimeout(()=>{const i=document.getElementById('chat-input'); if(i) i.focus();},250);
}
function closeChat(){ document.getElementById('chat-ov').classList.remove('open'); document.getElementById('chat').classList.remove('open'); }
function askFaq(i){ const f=faqFor()[i]; chatMsgs.push({who:'user',t:f.q}); chatMsgs.push({who:'bot',t:f.a}); renderChat(); }
function talkHuman(){ chatMsgs.push({who:'user',t:'Falar com um atendente'}); chatMsgs.push({who:'bot',t:'Certo, vou te encaminhar para um atendente da JusCash. É só aguardar um instante.'}); renderChat(); }
function sendChat(){
  const inp=document.getElementById('chat-input'); const v=(inp.value||'').trim(); if(!v)return;
  chatMsgs.push({who:'user',t:v}); inp.value='';
  chatMsgs.push({who:'bot',t:'Boa pergunta. Neste exemplo, respondo às dúvidas mais frequentes sobre o seu acompanhamento. Se preferir, posso te encaminhar para um atendente.'});
  renderChat();
}
function renderChat(){
  const body=document.getElementById('chat-body');
  let h=chatMsgs.map(m=>`<div class="msg ${m.who}">${m.t}</div>`).join('');
  const f=faqFor();
  h+=`<div class="chat-sugg">${f.map((x,i)=>`<button class="sugg" onclick="askFaq(${i})">${x.q}</button>`).join('')}<button class="sugg human" onclick="talkHuman()">Falar com um atendente</button></div>`;
  body.innerHTML=h; body.scrollTop=body.scrollHeight;
}

let prevId=null;
render();
</script>
</body>
